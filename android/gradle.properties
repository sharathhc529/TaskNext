# Project-wide Gradle settings.
# Increase JVM heap allocation to prevent GC thrashing and speed up builds
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError

# Enable Gradle build optimizations
org.gradle.parallel=true
org.gradle.caching=true

# Android flags
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin Daemon memory settings
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
